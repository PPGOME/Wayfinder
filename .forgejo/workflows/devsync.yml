name: DevSync

on:
  push:
    branches: [ main ]

jobs:
  run-shared-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
    
      - name: Checkout shared actions
        uses: actions/checkout@v4
        with:
          repository: NerdNu/Shared-Actions
          token: ${{ secrets.EXTRA_ACTION_TOKEN }}
          path: .forgejo/actions/Shared-Actions

      - name: Run Shared Sync
        uses: ./.forgejo/actions/Shared-Actions/devsync
        with:
          java-version: 25