prefix: "<blue><b>[</b><aqua>Wayfinder</aqua><b>]"

modules:
  home: true
  place: true
  teleport: true
  warp: true
  waypoint: true

# All message options support the <prefix> tag to add the plugin's prefix, as defined above.
messages:
  # All messages for "/place"
  place:
    normal:
      reachedDestination: "<green>You've reached your destination: <place>!"
      routingTo: "<green>Now routing to: <yellow><place></yellow>."
      alreadyRouting: "<red>You're already routing somewhere! Cancel the current route before starting a new one."
      doesNotExist: "<red>This place doesn't exist."
    editing:
      category:
        name: "<prefix> <green>Type what you want the name of this category to be into chat."
        priority: "<prefix> <green>Type what you want the priority of this category to be into chat."
        icon: "<prefix> <green>Type the direct image URL of the icon you wish to use for this category.<newline><red>NOTE! Use small images."
        alreadyExists: "<prefix> <red>A category with this name already exists."
      place:
        name: "<prefix> <green>Type what you want the name of this place to be into chat."
        builders: "<prefix> <green>Type the names of the builders of this place into chat, separated by commas. Doesn't have to be player names."
        expires: "<prefix> <green>Type the time until this place expires (i.e. 1d3h20m)."
        alreadyExists: "<prefix> <red>A place with this name already exists."
  # All messages for "/home"
  home:
    editing:
      name: "<prefix> <green>Type what you want the name of this home to be into chat."
  # All messages for "/warp"
  warp:
    normal:
      doesNotExist: "<gradient:#b554ff:#ff5555>Wooshy noises...</gradient> <color:#ff5555>That warp doesn't seem to exist.</color>"
      arrived: "<gradient:#b554ff:#ff73e8>Wooshy noises...</gradient> <color:#87ff69>You've arrived!</color>"
    editing:
      name: "<prefix> <green>Type what you want the name of this warp to be into chat."
      builders: "<prefix> <green>Type the names of the builders of this warp into chat, separated by commas. Doesn't have to be player names."
      permission: "<prefix> <green>Type the permission needed to access this warp (i.e. wayfinder.warp.player for players, wayfinder.warp.mod for moderators)."
      alreadyExists: "<prefix> <red>A warp with this name already exists."
  # All messages for "/wayfinder reload"
  reload:
    success: "<prefix> <green>The configuration has been reloaded successfully!"

gui:
  title:
    place:
      # The main screen displayed when "/place" is run.
      main: "<aqua>PvE Places"
      # The category creation screen.
      categoryBuilder: "<green>Category Builder"
      # The place creation screen.
      placeBuilder: "<green>Place Builder"
      # The category list displayed when adding a place to categories.
      # Supports the <place> tag to add the place being modified.
      categoryList: "<yellow>Selecting categories for <place>"
      # The place list displayed after clicking on a category.
      # Supports the <category> tag to add the category being browsed.
      placeList: "<green>Places in <category>"
    home:
      # The home creation/editor screen.
      homeBuilder: "<green>New home"
    warp:
      # The main screen displayed when "/warp" is run.
      main: "<aqua>PvE Warps"
      # The warp creation screen.
      builder: "<green>Warp Builder"


place:
  enableNetherPortals: true
  enableEndPortals: true
  enablePlayers: true